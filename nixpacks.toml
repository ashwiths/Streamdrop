providers = ["node"]

[phases.setup]
nixPkgs = ["python3", "ffmpeg", "curl"]

[phases.build]
cmds = [
  "cd media-downloader/backend && npm ci",
  "cd media-downloader/backend && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp",
  "cd media-downloader/backend && chmod a+rx yt-dlp"
]

[start]
cmd = "cd media-downloader/backend && node server.js"
