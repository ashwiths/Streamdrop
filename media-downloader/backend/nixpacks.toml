# nixpacks.toml — Railway build configuration
# Installs system packages needed by yt-dlp and ffmpeg.

[phases.setup]
# python3: required to run the bundled utils/yt-dlp zipapp
# ffmpeg:  required for yt-dlp to merge video+audio streams
nixPkgs = ["python3", "ffmpeg"]

[phases.install]
# Make the bundled yt-dlp binary executable after Railway clones the repo
cmds = ["chmod +x utils/yt-dlp || true", "npm ci --omit=dev"]

[start]
cmd = "node server.js"
